<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            background-color: #F9F6F0;
            color: #2B2B2B;
            font-family: sans-serif;
        }

        /* Coluna da esquerda (Formulários) */
        .coluna-esquerda {
            float: left;
            width: 50%;
            margin-left: 55px;
            margin-top: 40px;
        }

        /* Coluna da direita (Resumo do Pedido) */
        .coluna-direita {
            float: right;
            width: 35%;
            margin-right: 55px;
            margin-top: 40px;
            border: 1px solid #2B2B2B;
            padding: 20px;
        }

        /* Estilo básico para campos de formulário */
        input[type="text"], input[type="email"], select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #2B2B2B;
            box-sizing: border-box;
        }

        fieldset {
            border: 1px solid #2B2B2B;
            padding: 15px;
            margin-bottom: 20px;
        }

        legend {
            font-weight: bold;
            padding: 0 5px;
        }
    </style>
    <title>Checkout - Finalizar Compra</title>
</head>

<body>

    <h2 style="margin-left: 55px; margin-top: 40px; font-size: 28px;">Finalizar Compra</h2>

    <!-- COLUNA DA ESQUERDA: DADOS E FORMULÁRIOS -->
    <div class="coluna-esquerda">
        <form>
            <!-- Dados do Comprador -->
            <fieldset>
                <legend>Dados do Comprador</legend>
                
                <label>Nome Completo:</label>
                <input type="text" placeholder="Digite seu nome completo">

                <label>E-mail:</label>
                <input type="email" placeholder="seu@email.com">

                <label>CPF:</label>
                <input type="text" placeholder="000.000.000-00">

                <label>Telefone:</label>
                <input type="text" placeholder="(35) 99999-9999">
            </fieldset>

            <!-- Endereço de Entrega -->
            <fieldset>
                <legend>Endereço de Entrega</legend>

                <label>CEP:</label>
                <input type="text" placeholder="37701-000">

                <label>Rua/Avenida:</label>
                <input type="text" placeholder="Nome da rua">

                <label>Número:</label>
                <input type="text" placeholder="123">

                <label>Bairro:</label>
                <input type="text" placeholder="Centro">

                <label>Cidade / Estado:</label>
                <input type="text" placeholder="Poços de Caldas - MG">
            </fieldset>

            <!-- Forma de Pagamento -->
            <fieldset>
                <legend>Forma de Pagamento</legend>

                <p style="margin-top: 0;">Selecione como deseja pagar:</p>
                
                <input type="radio" id="cartao" name="pagamento" checked>
                <label for="cartao">Cartão de Crédito</label><br>

                <input type="radio" id="pix" name="pagamento">
                <label for="pix">PIX</label><br>

                <input type="radio" id="boleto" name="pagamento">
                <label for="boleto">Boleto Bancário</label><br><br>

                <!-- Dados do Cartão -->
                <div style="border-top: 1px solid #ccc; padding-top: 10px;">
                    <label>Número do Cartão:</label>
                    <input type="text" placeholder="0000 0000 0000 0000">

                    <label>Nome impresso no cartão:</label>
                    <input type="text" placeholder="Como está no cartão">

                    <label>Validade:</label>
                    <input type="text" placeholder="MM/AA">

                    <label>CVV:</label>
                    <input type="text" placeholder="123">
                </div>
            </fieldset>

            <!-- Botão de Finalizar -->
            <button type="button" style="font-size: 16px; cursor: pointer; width: 100%; height: 50px; background-color: #7bda7b; color: black; border: 1px solid black; font-weight: bold; margin-bottom: 50px;">
                Finalizar Compra
            </button>
        </form>
    </div>

    <!-- COLUNA DA DIREITA: RESUMO DO PEDIDO -->
    <div class="coluna-direita">
        <h3 style="margin-top: 0; border-bottom: 1px solid #2B2B2B; padding-bottom: 10px;">Resumo do Pedido</h3>

        <div style="display: flex; gap: 15px; margin-bottom: 15px;">
            <img src="Realismo.webp" alt="Realismo Capitalista" style="width: 80px;">
            <div>
                <p style="margin: 0; font-weight: bold;">Realismo Capitalista</p>
                <p style="margin: 5px 0 0 0; font-size: 14px;">Qtd: 1</p>
                <p style="margin: 5px 0 0 0; font-size: 14px;">Preço unitário: R$ 49,90</p>
            </div>
        </div>

        <hr style="border: 0; border-top: 1px solid #2B2B2B; margin: 15px 0;">

        <p style="margin: 5px 0;">Subtotal: <strong>R$ 49,90</strong></p>
        <p style="margin: 5px 0;">Frete: <strong>R$ 10,00</strong></p>
        <p style="margin: 15px 0 0 0; font-size: 20px;">Total: <strong>R$ 59,90</strong></p>
    </div>

</body>

</html>
